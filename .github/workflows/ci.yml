name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8

    - name: Lint with flake8
      run: |
        flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

    - name: Schema integrity check
      run: |
        python3 -c "import sqlite3, sys; c=sqlite3.connect(':memory:'); c.executescript(open('schema/001_schema.sql').read()); print('Schema OK')"

    - name: Script syntax check
      run: |
        for f in scripts/*.py; do python3 -m py_compile "$f"; done
